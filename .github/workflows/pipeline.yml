name: Autopilot pipeline (AI-generated videos)

permissions:
  contents: write
  issues: write

on:
  schedule:
    # Times chosen for target-audience active hours (US-centric since
    # that's where most YouTube ad revenue comes from). Previous times
    # (2/8/10/20 UTC) put uploads in the middle of the US night or the
    # dead 4-8am ET window, which meant the first-hour retention YouTube
    # weights so heavily for algo boost was earned against near-zero
    # traffic. New schedule targets when the actual viewer segments are
    # on the app:
    #   channel1 (adult trending facts, US-centric):
    #     shorts 14 UTC (10am ET) + 22 UTC (6pm ET) - lunch break and
    #       after-work scroll windows
    #     long   17 UTC Mon/Wed/Fri (1pm ET) - midday US
    #   channel2 (baby content, driven by parents/caregivers):
    #     short  13 UTC daily (9am ET) - morning routine when parents
    #       put on a video for the toddler
    #     long   14 UTC Sat/Sun + Wed (10am ET) - weekend morning
    #       + midweek downtime, mostly weekend
    # GitHub Actions cron is 5-15 min drifty - factor that in when
    # comparing against actual observed publish times.
    - cron: '0 14,22 * * *'  # channel1 (TeslaTravel) short: 10am + 6pm ET
    - cron: '0 17 * * 1,3,5' # channel1 (TeslaTravel) long: 1pm ET Mon/Wed/Fri
    - cron: '0 13 * * *'     # channel2 (Storytime Fables) short: 9am ET
    - cron: '0 14 * * 3,6,0' # channel2 (Storytime Fables) long: 10am ET Wed/Sat/Sun
  workflow_dispatch:
    inputs:
      channel:
        description: 'Run only this channel (leave blank to run both)'
        required: false
      format:
        description: 'Run only this format: short or long (leave blank to run both)'
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.set.outputs.jobs }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channels='["channel1","channel2"]'
            formats='["short","long"]'
            if [ -n "${{ github.event.inputs.channel }}" ]; then
              channels='["${{ github.event.inputs.channel }}"]'
            fi
            if [ -n "${{ github.event.inputs.format }}" ]; then
              formats='["${{ github.event.inputs.format }}"]'
            fi
            jobs=$(jq -cn --argjson channels "$channels" --argjson formats "$formats" \
              '[range(0; $channels|length) as $i | range(0; $formats|length) as $j | {channel: $channels[$i], format: $formats[$j]}]')
          else
            # channel1 re-enabled 2026-10-19: msedge-tts 2.1.0 (released
            # 2026-10-13) fixes the Edge TTS 403 that paused channel1 on
            # 2026-10-12 (Microsoft changed the endpoint's auth token
            # scheme - see https://github.com/rany2/edge-tts/issues/490).
            # Confirmed directly: upgrading unblocks real TTS generation
            # locally, 2/2 trials succeeded.
            case "${{ github.event.schedule }}" in
              '0 14,22 * * *')  jobs='[{"channel":"channel1","format":"short"}]' ;;
              '0 17 * * 1,3,5') jobs='[{"channel":"channel1","format":"long"}]' ;;
              '0 13 * * *')     jobs='[{"channel":"channel2","format":"short"}]' ;;
              '0 14 * * 3,6,0') jobs='[{"channel":"channel2","format":"long"}]' ;;
              *) jobs='[]' ;;
            esac
          fi
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  # One parameterized job fanned out over (channel, format) pairs.
  publish:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    # AI motion clips render on a Kaggle GPU (up to ~75 min for a long video)
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: backend
        run: |
          # npm ci is safe to retry - ffmpeg-static's postinstall binary
          # download has hit transient 504s from GitHub's release CDN.
          # No apt-get step any more: sharp and ffmpeg-static ship prebuilt
          # binaries (node-canvas and its native build are gone).
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci attempt $attempt failed, retrying..."
            sleep $((attempt * 10))
          done
          echo "::error::npm ci failed after retries"
          exit 1
      - name: Install Kaggle CLI (free GPU for AI motion clips)
        # Best-effort: without it (or without the secrets) videos still
        # publish using AI stills + camera motion. pipx is preinstalled on
        # GitHub's Ubuntu runners - no apt-get involved.
        run: pipx install kaggle || echo "::warning::kaggle CLI install failed - AI clips disabled for this run"
      - name: Generate and publish ${{ matrix.channel }} (${{ matrix.format }})
        working-directory: backend
        env:
          # Free Cloudflare Workers AI account: script LLM + FLUX images + backup TTS
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_TEXT_MODEL: ${{ vars.CF_TEXT_MODEL }}
          CF_IMAGE_MODEL: ${{ vars.CF_IMAGE_MODEL }}
          # Optional: Pollinations fallback images + AI motion clips
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_VIDEO_MODEL: ${{ vars.POLLINATIONS_VIDEO_MODEL }}
          # Optional: free Kaggle GPU renders real AI motion clips (LTX-Video)
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          LTX_STEPS: ${{ vars.LTX_STEPS }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_CHANNEL1: ${{ secrets.YT_REFRESH_TOKEN_CHANNEL1 }}
          YT_REFRESH_TOKEN_CHANNEL2: ${{ secrets.YT_REFRESH_TOKEN_CHANNEL2 }}
        run: |
          # empty vars.* come through as "" - drop them so code defaults apply
          for v in CF_TEXT_MODEL CF_IMAGE_MODEL POLLINATIONS_VIDEO_MODEL LTX_STEPS; do
            [ -z "${!v}" ] && unset $v
          done
          node src/run-pipeline.js ${{ matrix.channel }} ${{ matrix.format }}
      - name: Upload thumbnail variants
        # The Data API can't run Studio's thumbnail A/B test, so both
        # candidates are kept here (out/ is never committed).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnails-${{ matrix.channel }}-${{ matrix.format }}-${{ github.run_id }}
          path: backend/out/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit updated history
        working-directory: backend
        run: |
          git config user.name "autopilot-bot"
          git config user.email "actions@users.noreply.github.com"
          node scripts/merge-and-push-history.js ${{ matrix.channel }}

  # A real incident (2026-08-14 to 2026-08-17) motivated this: a bad
  # apt-get package name broke every single scheduled run on both
  # channels for 3 days straight, and nobody knew until someone happened
  # to check the Actions tab - the pipeline was "failing loudly" in the
  # sense of exiting non-zero, but that's worthless if nothing surfaces
  # it. Runs after `publish` regardless of its outcome (`if: always()`
  # at the job level - the default is to skip a job once a dependency
  # fails) and opens/updates a single tracking issue on failure, closing
  # it automatically once a run succeeds again - so a sustained outage
  # gets ONE issue with a growing comment thread, not a new issue per
  # failed run (which is what would happen with 9 consecutive failures
  # otherwise).
  notify-on-failure:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.publish.result }}';
            // 'skipped' means this trigger's cron entry matched no known
            // schedule (see the `plan` job) - not a failure, and not
            // evidence of a fix either, so leave any open issue alone.
            if (result === 'skipped') return;

            const label = 'pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });

            if (result === 'failure') {
              if (openIssues.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: openIssues[0].number,
                  body: `Another scheduled run failed: ${runUrl}`
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: 'Autopilot pipeline is failing',
                  body: `A scheduled pipeline run failed: ${runUrl}\n\nThis issue closes itself automatically once a run succeeds again.`,
                  labels: [label]
                });
              }
            } else if (result === 'success' && openIssues.length > 0) {
              for (const issue of openIssues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Resolved - a pipeline run succeeded: ${runUrl}`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }
