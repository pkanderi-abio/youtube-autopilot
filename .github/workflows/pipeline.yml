name: Autopilot pipeline

permissions:
  contents: write

on:
  schedule:
    # Times chosen for target-audience active hours (US-centric since
    # that's where most YouTube ad revenue comes from). Previous times
    # (2/8/10/20 UTC) put uploads in the middle of the US night or the
    # dead 4-8am ET window, which meant the first-hour retention YouTube
    # weights so heavily for algo boost was earned against near-zero
    # traffic. New schedule targets when the actual viewer segments are
    # on the app:
    #   channel1 (adult trending facts, US-centric):
    #     shorts 14 UTC (10am ET) + 22 UTC (6pm ET) - lunch break and
    #       after-work scroll windows
    #     long   17 UTC Mon/Wed/Fri (1pm ET) - midday US
    #   channel2 (baby content, driven by parents/caregivers):
    #     short  13 UTC daily (9am ET) - morning routine when parents
    #       put on a video for the toddler
    #     long   14 UTC Sat/Sun + Wed (10am ET) - weekend morning
    #       + midweek downtime, mostly weekend
    # GitHub Actions cron is 5-15 min drifty - factor that in when
    # comparing against actual observed publish times.
    - cron: '0 14,22 * * *'  # channel1 (TeslaTravel) short: 10am + 6pm ET
    - cron: '0 17 * * 1,3,5' # channel1 (TeslaTravel) long: 1pm ET Mon/Wed/Fri
    - cron: '0 13 * * *'     # channel2 (Storytime Fables) short: 9am ET
    - cron: '0 14 * * 3,6,0' # channel2 (Storytime Fables) long: 10am ET Wed/Sat/Sun
  workflow_dispatch:
    inputs:
      channel:
        description: 'Run only this channel (leave blank to run both)'
        required: false
      format:
        description: 'Run only this format: short or long (leave blank to run both)'
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.set.outputs.jobs }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channels='["channel1","channel2"]'
            formats='["short","long"]'
            if [ -n "${{ github.event.inputs.channel }}" ]; then
              channels='["${{ github.event.inputs.channel }}"]'
            fi
            if [ -n "${{ github.event.inputs.format }}" ]; then
              formats='["${{ github.event.inputs.format }}"]'
            fi
            jobs=$(jq -cn --argjson channels "$channels" --argjson formats "$formats" \
              '[range(0; $channels|length) as $i | range(0; $formats|length) as $j | {channel: $channels[$i], format: $formats[$j]}]')
          else
            case "${{ github.event.schedule }}" in
              '0 14,22 * * *')  jobs='[{"channel":"channel1","format":"short"}]' ;;
              '0 17 * * 1,3,5') jobs='[{"channel":"channel1","format":"long"}]' ;;
              '0 13 * * *')     jobs='[{"channel":"channel2","format":"short"}]' ;;
              '0 14 * * 3,6,0') jobs='[{"channel":"channel2","format":"long"}]' ;;
              *) jobs='[]' ;;
            esac
          fi
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  # Single parameterized job fanned out over (channel, format) pairs -
  # both channels now share the exact same pipeline shape (real stock
  # footage, no per-channel special-casing needed), so one matrix job
  # replaces what used to be two near-duplicate job definitions.
  publish:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: backend
        run: |
          # npm ci itself is safe to retry (always a clean reinstall from
          # the lockfile) - observed directly in production: ffmpeg-static's
          # postinstall binary download hit a transient 504 from GitHub's
          # release CDN and failed the whole job before the pipeline even
          # started.
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci attempt $attempt failed, retrying..."
            sleep $((attempt * 10))
          done
          echo "::error::npm ci failed after retries"
          exit 1
      - name: Install ffmpeg system libs (canvas native build)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-llama3.2-v1
      - name: Start Ollama and pull model
        run: |
          # install.sh already enables+starts Ollama as a systemd service
          # bound to :11434 (confirmed via real CI logs: a manual
          # `ollama serve &` here just fails instantly with "address
          # already in use" and does nothing useful) - just wait for the
          # systemd-managed instance to be ready, then pull the model.
          # 180s (was 60s, was 30s): a cluster of real failures
          # 2026-07-20..24 all timed out at exactly the previous 60s cap
          # ("Start Ollama and pull model" completed at t+61s with the
          # service still not answering /api/version). systemd unit
          # start time on a shared CI runner is genuinely variable, so
          # give it real headroom. Also: if the loop exhausts without
          # ever seeing a 200 from /api/version, fail explicitly instead
          # of silently proceeding to `ollama pull` against a dead server
          # (which just fails cryptically a second later).
          ollama_ready=false
          for i in $(seq 1 180); do
            if curl -sf http://127.0.0.1:11434/api/version >/dev/null; then
              echo "Ollama ready after ${i}s"
              ollama_ready=true
              break
            fi
            sleep 1
          done
          if [ "$ollama_ready" != "true" ]; then
            echo "::error::Ollama did not answer /api/version within 180s"
            exit 1
          fi
          # `ollama pull` itself has been observed to fail transiently
          # on the CI runner (network blip mid-download of the model
          # blob); one-shot means the whole job dies on a retriable
          # error. Retry a few times with growing backoff before giving
          # up - same pattern as the npm ci step above.
          for attempt in 1 2 3; do
            if ollama pull llama3.2; then
              exit 0
            fi
            echo "ollama pull attempt $attempt failed, retrying..."
            sleep $((attempt * 15))
          done
          echo "::error::ollama pull failed after 3 attempts"
          exit 1
      - name: Run pipeline for ${{ matrix.channel }} (${{ matrix.format }})
        working-directory: backend
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_CHANNEL1: ${{ secrets.YT_REFRESH_TOKEN_CHANNEL1 }}
          YT_REFRESH_TOKEN_CHANNEL2: ${{ secrets.YT_REFRESH_TOKEN_CHANNEL2 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node src/run-pipeline.js ${{ matrix.channel }} ${{ matrix.format }}
      - name: Dump Ollama server log on failure
        if: failure()
        # Ollama runs as a systemd service (see "Start Ollama and pull
        # model" above), not the foreground process a bare /tmp/ollama.log
        # redirect would capture - its real stdout/stderr (including
        # llama-server crash detail) is in the systemd journal.
        run: sudo journalctl -u ollama --no-pager -n 300 || true
      - name: Commit updated history
        working-directory: backend
        run: |
          git config user.name "autopilot-bot"
          git config user.email "actions@users.noreply.github.com"
          node scripts/merge-and-push-history.js ${{ matrix.channel }}
